# Funcionamento:
#
# Inicialmente o cli, ao ser executado, realiza uma requisicao HTTP para buscar e exibir o resumo de um artigo utilizando o pacote HTTP.
# Dentro da pasta dartpedia em home/nome.dobrenome/dartpedia/cli rode o comando dart pub get: deve ser feita  ainstalacao das dependencias do projeto e o pacote HTTP ficara disponivel para uso do aplicativo
# 
# Obs. Importante:
# 
# Este aplicativo esta em desenvolvimento e ao longo do tempo o comportamento do aplicativo pode mudar.
