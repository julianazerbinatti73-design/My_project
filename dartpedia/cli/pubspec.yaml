#Versao: 0.0.2
#
#Data: 11/05/2026
#
#Descricao do codigo: Adicionar command_runner como dependência
#
#Agora que você criou o command_runner pacote e adicionou uma CommandRunner classe de espaço reservado, precisa informar ao seu cli aplicativo que ele depende dele command_runner. Como o command_runner pacote está localizado localmente dentro do seu projeto, você pode usar uma dependência de caminho .

#Abra o cli/pubspec.yamlarquivo.

#Observação
#Certifique-se de abrir o /dartpedia/cli/pubspec.yaml arquivo correto. Quando você criou o command_runner pacote, ele também veio com um /dartpedia/command_runner/pubspec.yaml arquivo.

#Como o cli pacote é um pacote de aplicativo e não se destina à publicação no pub.dev, adicione `--pub-dev` publish_to: none após o name campo. Isso ajuda a evitar publicações acidentais e impede avisos do analisador sobre a adição de dependências de caminho.

#name: cli
#publish_to: none
# ...
#Localize a dependencies seção. Adicione as seguintes linhas:

#dependencies:
#  http: ^1.3.0 # Keep your existing http dependency
#  command_runner:
#    path: ../command_runner # Points to your local command_runner package

#Esta seção informa ao cli aplicativo que ele deve depender do command_runner pacote e especifica que o pacote está localizado no ../command_runner diretório (relativo ao clidiretório).

#Execute o comando dart pub get no /dartpedia/cli diretório do seu terminal para obter a nova dependência.

#Codigo:
#
#name: cli
#publish_to: none
#description: A sample command-line application.
#version: 1.0.0
#repository: https://github.com/my_org/my_repo

#environment:
